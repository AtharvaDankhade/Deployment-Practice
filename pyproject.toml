[project]
name = "calculator"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Make `import app` work regardless of how pytest is invoked.
# `python -m pytest` adds the cwd to sys.path; the bare `pytest` script does not,
# which is exactly how CI ran it.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
