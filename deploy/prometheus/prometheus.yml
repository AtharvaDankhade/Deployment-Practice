global:
  # How often Prometheus asks every target for metrics.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # job_name becomes the "job" label on every series: {job="calculator"}.
  - job_name: calculator
    metrics_path: /metrics
    static_configs:
      # "app" is the compose service name, resolved by Docker's internal DNS.
      - targets: ["app:8000"]
        labels:
          service: calculator
