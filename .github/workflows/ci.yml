name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: read the repo, write packages (GHCR). Nothing else.
permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # Gate: nothing gets built or published unless lint + tests pass.
  # ---------------------------------------------------------------------------
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Build the image once, prove it runs, then publish it.
  # PRs build but never push: no untrusted code lands in the registry.
  # ---------------------------------------------------------------------------
  image:
    name: Build & publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase repository names. ${var,,} lowercases in bash.
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            calculator:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tests passing != image working. This is the difference between CI and
      # "it compiled on my machine".
      - name: Smoke test the built image
        run: |
          set -euo pipefail
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT

          docker run -d --name smoke -p 8000:8000 calculator:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "app is up after ${i}s"
              break
            fi
            sleep 1
          done

          echo "--- healthz ---"
          curl -fsS http://localhost:8000/healthz

          echo "--- calculate 6*7 ---"
          curl -fsS -X POST http://localhost:8000/api/calculate \
            -H 'content-type: application/json' \
            -d '{"operation":"multiply","a":6,"b":7}'

          echo "--- runs as ---"
          docker exec smoke whoami

          echo "--- logs ---"
          docker logs smoke | tail -5

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: calculator:ci
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
        continue-on-error: true
